name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
  ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.2.12479018

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"

          packages=()
          test -d "$ANDROID_SDK_ROOT/platforms/android-37.0" || packages+=("platforms;android-37.0")
          test -d "$ANDROID_SDK_ROOT/build-tools/37.0.0" || packages+=("build-tools;37.0.0")
          test -d "$ANDROID_NDK_HOME" || packages+=("ndk;27.2.12479018")

          if (( ${#packages[@]} > 0 )); then
            yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
            "$sdkmanager" --channel=3 "${packages[@]}"
          else
            echo "Android SDK components restored from cache"
          fi

      - name: Install Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android
          rust_version="$(rustc --version | tr ' ' '-')"
          printf 'cache-version=%s\n' "$rust_version" >> "$GITHUB_OUTPUT"

      - name: Restore Rust cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.cache-version }}-${{ hashFiles('rust/Cargo.lock') }}-cargo-ndk-4.1.2-${{ hashFiles('rust/Cargo.toml', 'rust/src/**') }}-v2
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.cache-version }}-${{ hashFiles('rust/Cargo.lock') }}-cargo-ndk-4.1.2-
            rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.cache-version }}-

      - name: Install cargo-ndk
        shell: bash
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1 || \
             ! cargo ndk --version | grep -q '4\.1\.2'; then
            cargo install cargo-ndk --version 4.1.2 --locked
          else
            echo "cargo-ndk restored from cache"
          fi

      - name: Restore release signing material
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          : "${SIGNING_KEYSTORE_BASE64:?Missing SIGNING_KEYSTORE_BASE64}"
          : "${SIGNING_STORE_PASSWORD:?Missing SIGNING_STORE_PASSWORD}"
          : "${SIGNING_KEY_ALIAS:?Missing SIGNING_KEY_ALIAS}"
          : "${SIGNING_KEY_PASSWORD:?Missing SIGNING_KEY_PASSWORD}"

          mkdir -p keystore
          printf '%s' "$SIGNING_KEYSTORE_BASE64" \
            | base64 --decode > keystore/signaldock-release.p12
          chmod 600 keystore/signaldock-release.p12

          {
            printf 'storeFile=keystore/signaldock-release.p12\n'
            printf 'storePassword=%s\n' "$SIGNING_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$SIGNING_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$SIGNING_KEY_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties

      - name: Check Rust core
        working-directory: rust
        shell: bash
        run: |
          cargo fmt --check
          cargo test
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Build Android release
        shell: bash
        run: |
          ./gradlew --no-daemon \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleRelease

      - name: Verify and prepare APK
        shell: bash
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" \
            verify --verbose --print-certs "$apk"

          mkdir -p dist
          output_name="SignalDock-${GITHUB_REF_NAME}.apk"
          output="dist/$output_name"
          cp "$apk" "$output"
          (
            cd dist
            sha256sum "$output_name" > "${output_name}.sha256"
          )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SignalDock-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "SignalDock $GITHUB_REF_NAME" \
            --generate-notes \
            --latest

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f keystore.properties keystore/signaldock-release.p12
